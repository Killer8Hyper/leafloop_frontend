name: leafloop
description: "A new Flutter project for Week 10."
publish_to: 'none'
version: 1.6.7+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  lottie: ^3.1.0
  image_picker: ^1.1.2
  sqflite: ^2.3.0
  path: ^1.8.0
  tflite_flutter: ^0.11.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  path_provider: ^2.1.5
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo/LeafLoop2.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo/LeafLoop2.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/LeafLoop_name.png
    - assets/images/logo/LeafLoop1.png
    - assets/images/logo/LeafLoop2.png
    - assets/animations/tree.json
    - assets/images/icons/sapling.png
    - assets/images/icons/trophy.png
    - assets/images/icons/confetti.png
    - assets/models/